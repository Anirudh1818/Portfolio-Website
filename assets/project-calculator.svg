<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="500" fill="#171717"/>
  <rect x="44" y="54" width="430" height="392" rx="14" fill="#0E0E0E" stroke="#2C2C2C"/>
  <circle cx="66" cy="76" r="5" fill="#3A3A3A"/>
  <circle cx="82" cy="76" r="5" fill="#3A3A3A"/>
  <circle cx="98" cy="76" r="5" fill="#3A3A3A"/>
  <text x="259" y="80" font-size="10.5" fill="#6B6B6B" text-anchor="middle" font-family="Menlo, Consolas, monospace">calc.c</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12.5">
    <text x="66" y="120" fill="#FFB23F">$ <tspan fill="#E8E6E1">gcc calc.c -o calc -lm</tspan></text>
    <text x="66" y="142" fill="#FFB23F">$ <tspan fill="#E8E6E1">./calc</tspan></text>
    <text x="66" y="174" fill="#8A867E">--- Scientific Calculator ---</text>
    <text x="66" y="196" fill="#E8E6E1">1. Add</text>
    <text x="200" y="196" fill="#E8E6E1">6. Square root</text>
    <text x="66" y="216" fill="#E8E6E1">2. Subtract</text>
    <text x="200" y="216" fill="#E8E6E1">7. Log</text>
    <text x="66" y="236" fill="#E8E6E1">3. Multiply</text>
    <text x="200" y="236" fill="#E8E6E1">8. Sin/Cos/Tan</text>
    <text x="66" y="256" fill="#E8E6E1">4. Divide</text>
    <text x="200" y="256" fill="#E8E6E1">9. Exit</text>
    <text x="66" y="276" fill="#E8E6E1">5. Power</text>
    <text x="66" y="308" fill="#8A867E">Enter choice: <tspan fill="#E8E6E1">4</tspan></text>
    <text x="66" y="328" fill="#8A867E">Enter a and b: <tspan fill="#E8E6E1">12 0</tspan></text>
    <text x="66" y="350" fill="#FF7A6B">Error: can't divide by zero</text>
    <text x="66" y="382" fill="#8A867E">Enter choice: <tspan fill="#E8E6E1">6</tspan></text>
    <text x="66" y="402" fill="#8A867E">Enter a: <tspan fill="#E8E6E1">-9</tspan></text>
    <text x="66" y="424" fill="#FF7A6B">Error: no real root for negatives</text>
  </g>
  <rect x="500" y="54" width="256" height="392" rx="22" fill="#FAFAF8"/>
  <rect x="518" y="74" width="220" height="86" rx="12" fill="#EDEBE6"/>
  <text x="726" y="102" font-size="12" fill="#8A867E" text-anchor="end">log(0)</text>
  <text x="726" y="142" font-size="24" font-weight="700" fill="#171717" text-anchor="end">undefined</text>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="518" y="176" width="48" height="40" rx="10" fill="#EDEBE6"/><text x="542" y="201" fill="#171717">sin</text>
    <rect x="575" y="176" width="48" height="40" rx="10" fill="#EDEBE6"/><text x="599" y="201" fill="#171717">cos</text>
    <rect x="632" y="176" width="48" height="40" rx="10" fill="#EDEBE6"/><text x="656" y="201" fill="#171717">log</text>
    <rect x="689" y="176" width="48" height="40" rx="10" fill="#171717"/><text x="713" y="201" fill="#fff">÷</text>
    <rect x="518" y="224" width="48" height="40" rx="10" fill="#fff" stroke="#E2DED6"/><text x="542" y="249" fill="#171717">7</text>
    <rect x="575" y="224" width="48" height="40" rx="10" fill="#fff" stroke="#E2DED6"/><text x="599" y="249" fill="#171717">8</text>
    <rect x="632" y="224" width="48" height="40" rx="10" fill="#fff" stroke="#E2DED6"/><text x="656" y="249" fill="#171717">9</text>
    <rect x="689" y="224" width="48" height="40" rx="10" fill="#171717"/><text x="713" y="249" fill="#fff">×</text>
    <rect x="518" y="272" width="48" height="40" rx="10" fill="#fff" stroke="#E2DED6"/><text x="542" y="297" fill="#171717">4</text>
    <rect x="575" y="272" width="48" height="40" rx="10" fill="#fff" stroke="#E2DED6"/><text x="599" y="297" fill="#171717">5</text>
    <rect x="632" y="272" width="48" height="40" rx="10" fill="#fff" stroke="#E2DED6"/><text x="656" y="297" fill="#171717">6</text>
    <rect x="689" y="272" width="48" height="40" rx="10" fill="#171717"/><text x="713" y="297" fill="#fff">−</text>
    <rect x="518" y="320" width="48" height="40" rx="10" fill="#fff" stroke="#E2DED6"/><text x="542" y="345" fill="#171717">1</text>
    <rect x="575" y="320" width="48" height="40" rx="10" fill="#fff" stroke="#E2DED6"/><text x="599" y="345" fill="#171717">2</text>
    <rect x="632" y="320" width="48" height="40" rx="10" fill="#fff" stroke="#E2DED6"/><text x="656" y="345" fill="#171717">3</text>
    <rect x="689" y="320" width="48" height="40" rx="10" fill="#171717"/><text x="713" y="345" fill="#fff">+</text>
    <rect x="518" y="368" width="48" height="40" rx="10" fill="#fff" stroke="#E2DED6"/><text x="542" y="393" fill="#171717">√</text>
    <rect x="575" y="368" width="48" height="40" rx="10" fill="#fff" stroke="#E2DED6"/><text x="599" y="393" fill="#171717">0</text>
    <rect x="632" y="368" width="105" height="40" rx="10" fill="#FFB23F"/><text x="684" y="393" fill="#171717">=</text>
  </g>
  <text x="628" y="432" font-size="9.5" fill="#8A867E" text-anchor="middle">same switch-case, step by step</text>
